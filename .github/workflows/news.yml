name: Update TrueNews news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update RSS news
        run: python scripts/update_news.py

      - name: Commit news
        run: |
          git config user.name "TrueNews Bot"
          git config user.email "actions@github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Auto update news"
          git push
