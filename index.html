<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrueNews</title>
<style>
:root{--text:#f5f7ff;--muted:rgba(245,247,255,.7);--line:rgba(255,255,255,.24);--r:26px}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark;background:#070912}
body{min-height:100vh;font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){width:60vmax;height:60vmax;background:#4a5cff;top:-22vmax;left:-18vmax}
.bg i:nth-child(2){width:55vmax;height:55vmax;background:#ff5c8a;bottom:-24vmax;right:-16vmax;animation-delay:-9s}
.bg i:nth-child(3){width:36vmax;height:36vmax;background:#2fe0d0;top:38%;left:40%;opacity:.45;animation-delay:-15s}
@keyframes drift{to{transform:translate(14vmax,9vmax) scale(1.18)}}

.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08),0 12px 40px rgba(0,0,0,.35)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.24),transparent 62%);opacity:0;transition:opacity .3s}
.glass:hover::after{opacity:1}

.wrap{max-width:1032px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(120px + env(safe-area-inset-bottom,0px))}
header.glass{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 20px;border-radius:99px;margin-bottom:20px}
.logo{flex:none;display:flex;align-items:center;gap:9px;font-size:19px;font-weight:750;letter-spacing:-.02em}
.dot{width:9px;height:9px;border-radius:50%;background:#46f0a0;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,240,160,.7)}70%,100%{box-shadow:0 0 0 9px rgba(70,240,160,0)}}
#clock{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
#sb{flex:none;display:grid;place-items:center;padding:0;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.12);color:var(--text);cursor:pointer;transition:transform .25s cubic-bezier(.3,1.4,.4,1)}
#sb:active{transform:scale(.9)}
#sb svg{width:18px;height:18px}
#sb .x{display:none}
header.searching #sb .m{display:none}
header.searching #sb .x{display:block}
#q{display:none;flex:1;min-width:0;height:38px;padding:0 16px;border:1px solid var(--line);outline:0;border-radius:99px;background:rgba(255,255,255,.12);color:var(--text);font:inherit;font-size:16px}
#q::placeholder{color:var(--muted)}
#q:focus{border-color:rgba(255,255,255,.55)}
header.searching .logo,header.searching #rates,header.searching #clock{display:none}
header.searching #q{display:block}
#rates{flex:1;display:flex;justify-content:flex-end;gap:14px;min-width:0;overflow-x:auto;scrollbar-width:none;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
#rates::-webkit-scrollbar{display:none}
.rt{display:flex;align-items:center;gap:5px;color:var(--muted)}
.rt b{color:var(--text);font-weight:650}
.rt i{font-style:normal;font-size:11.5px;font-weight:650}
.up{color:#46f0a0}.dn{color:#ff6b7a}.fl{color:var(--muted)}
@media(max-width:719px){header.glass{flex-wrap:wrap;row-gap:6px;border-radius:28px}.logo{flex:1}#rates{order:5;flex:0 0 100%;justify-content:space-between}}
#st{font-size:13px;color:var(--muted);margin:0 8px 14px}
#st:empty{display:none}

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;transition:opacity .2s,transform .2s}
#grid.out{opacity:0;transform:scale(.98)}
.card{display:flex;flex-direction:column;gap:12px;padding:16px;color:inherit;text-decoration:none;transition:transform .25s cubic-bezier(.3,1.4,.4,1)}
.card:active{transform:scale(.985)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px}
.tx{display:flex;flex-direction:column;gap:10px}
.meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.chip{padding:3px 11px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid var(--line);font-weight:650;color:var(--text)}
.card h3{font-size:17px;line-height:1.28;font-weight:680;letter-spacing:-.01em}
.card p{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero{grid-column:1/-1}
.hero h3{font-size:clamp(23px,4.2vw,34px);line-height:1.15;letter-spacing:-.025em}
.hero p{font-size:15px}
@media(min-width:720px){.hero{flex-direction:row;align-items:center;gap:24px;padding:20px}.hero img{width:46%;flex:none}.hero .tx{gap:14px}}
#more{display:block;margin:22px auto 0;padding:13px 30px;border-radius:99px;color:var(--text);font:inherit;font-weight:650;cursor:pointer;border-width:1px}
#more[hidden]{display:none}
.enter{animation:in .55s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*55ms)}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.97)}}
.sk{height:190px;overflow:hidden}
.sk::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);transform:translateX(-100%);animation:sh 1.3s infinite}
@keyframes sh{to{transform:translateX(100%)}}

nav.glass{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:2px;padding:6px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;border-radius:99px;z-index:6}
nav::-webkit-scrollbar{display:none}
nav button{position:relative;z-index:1;background:none;border:0;color:var(--muted);font:inherit;font-size:14.5px;font-weight:620;padding:10px 17px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:color .3s}
nav button.on{color:#fff}
.pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:99px;background:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 4px 18px rgba(0,0,0,.3);transition:transform .55s cubic-bezier(.3,1.45,.4,1),width .55s cubic-bezier(.3,1.45,.4,1)}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="glass">
    <div class="logo"><span class="dot"></span>TrueNews</div>
    <div id="rates" aria-label="Курсы валют и котировки"></div>
    <span id="clock"></span>
    <input id="q" type="search" placeholder="Поиск по новостям" autocomplete="off" enterkeyhint="search" aria-label="Поиск по новостям">
    <button id="sb" aria-label="Поиск"><svg class="m" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <p id="st"></p>
  <main id="grid"></main>
  <button id="more" class="glass" hidden>Показать ещё</button>
</div>
<nav id="tabs" class="glass" aria-label="Категории"><span class="pill"></span></nav>

<script>
// Новости берутся из news.json, который обновляет GitHub Actions
const DATA="news.json";
const CATS=[{id:"all",name:"Все"},{id:"politics",name:"Политика"},{id:"incidents",name:"Происшествия"},{id:"spb",name:"СПБ"},{id:"culture",name:"Культура"},{id:"sport",name:"Спорт"}];
const P=w=>new RegExp("(?<![а-яёa-z0-9])(?:"+w.join("|")+")","i");
const RULES={
 politics:P(["путин","президент","правительств","госдум","совфед","совет федерации","министр","кремл","выбор","депутат","санкци","переговор","лавров","песков","зеленск","трамп","байден","нато","политик","губернатор","указ","законопроект","мид(?![а-я])","сво(?![а-я])","всу(?![а-я])","спецоперац","украин","евросоюз","партия","партии","мэр(?![а-я])"]),
 incidents:P(["пожар","взрыв","дтп","авари","погиб","убит","убийств","ранен","задержа","арест","полици","мвд","следственн","обыск","мошенник","мошеннич","огра[бв]","краж","преступ","нападен","стрельб","пострадав","спасател","мчс","трагеди","обрушен","утонул","теракт","уголовн","приговор","осужд","чп(?![а-я])","сгорел","погибш"]),
 spb:P(["санкт-петербург","петербург","питер(?![а-я])","спб(?![а-я])","ленинградск","кронштадт","пулково","смольн","невск","петербурж"]),
 culture:P(["театр","кино(?![а-я])","кинотеатр","фильм","музе[йяеюи]","выставк","концерт","музык","артист","актёр","актер","актрис","режисс","премьер(?!-министр)","книг","писател","фестивал","искусств","певец","певиц","сериал","балет","опер(?!атив|ац)","эрмитаж","картин","литератур","культур","галере","оскар","шоу(?![а-я])"]),
 sport:P(["футбол","хоккей","матч","чемпионат","турнир","олимпи","спортсмен","спорт(?![а-я])","теннис","баскетбол","зенит","спартак","цска","динамо","сборн","гонк","формул","биатлон","фигурист","кубок","тренер","волейбол","бокс","ufc","мма(?![а-я])","шайб","нхл","кхл","рпл","лига","чемпион"])
};
const SPB_SRC=["Фонтанка","78.ru","Мойка78","Петербургский дневник","Росбалт","Neva.Today"];
function classify(x){
 const t=(x.title+" "+x.raw+" "+x.tags).toLowerCase(),c=[];
 for(const k in RULES)if(RULES[k].test(t))c.push(k);
 if(SPB_SRC.includes(x.src)&&!c.includes("spb"))c.push("spb");
 return c;
}
const $=s=>document.querySelector(s),g=$("#grid"),tabs=$("#tabs"),pill=tabs.querySelector(".pill");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https?:\/\//.test(u)?u:"#";
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const ago=d=>{const m=Math.round((Date.now()-d)/6e4);if(isNaN(m))return"";if(m<1)return"только что";if(m<60)return m+" мин назад";const h=Math.round(m/60);return h<24?h+" ч назад":Math.round(h/24)+" дн назад"};
let cur="all",tok=0,q="";
const norm=s=>String(s||"").toLowerCase().replace(/ё/g,"е");

let DB=null,UPD="",NEWF=false;
const strip=t=>String(t||"").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
async function loadDB(){
 if(DB)return DB;
 const r=await fetch(DATA+"?v="+Date.now(),{cache:"no-store"});
 if(!r.ok)throw new Error("news.json "+r.status);
 const j=await r.json();UPD=j.updated||"";
 DB=(j.news||j.items||[]).map(x=>{
  const src=x.source||x.src||"";let title=strip(x.title);
  if(src&&title.endsWith(" - "+src))title=title.slice(0,-(src.length+3));
  const it={id:src,src,title,link:x.link,text:"",img:x.img||"",t:new Date(x.pub||x.t),raw:strip(x.text||x.description),tags:(x.tags||[]).join(" ")};
  it.cats=classify(it);
  it.hay=norm(title+" "+it.raw+" "+src);
  return it;
 });
 return DB;
}
const sample=n=>Array.from({length:6},(_,i)=>({src:n,title:"Здесь появится заголовок новости из ленты «"+n+"»",text:"Так выглядит краткое описание. Настоящие карточки подтянутся из RSS.",img:"",t:new Date(Date.now()-i*47*6e4),link:"#"}));

async function get(id){
 try{
  const all=await loadDB();
  if(!all.length)throw new Error("empty");
  let list;
  if(q){const ws=norm(q).split(/\s+/).filter(Boolean);list=all.filter(x=>ws.every(w=>x.hay.includes(w)))}
  else list=id==="all"?all:all.filter(x=>x.cats.includes(id));
  list=list.slice().sort((a,b)=>b.t-a.t).slice(0,1000);
  return[list,list.length?false:(q?"none":"empty")];
 }catch(e){
  return[sample("Новости"),"err"];
 }
}
const card=(n,i)=>`<a class="card glass enter${i?"":" hero"}" style="--i:${i}" href="article.html?u=${encodeURIComponent(n.link)}" target="_blank" rel="noopener">${n.img?`<img src="${esc(n.img)}" alt="" loading="lazy" onerror="this.remove()">`:""}<div class="tx"><div class="meta"><span class="chip">${esc(n.src)}</span><span>${ago(n.t)}</span></div><h3>${esc(n.title)}</h3>${n.text?`<p>${esc(n.text)}</p>`:""}</div></a>`;

function mark(){
 tabs.querySelectorAll("button").forEach(b=>{
  const on=b.dataset.id===cur;b.classList.toggle("on",on);
  if(on){pill.style.width=b.offsetWidth+"px";pill.style.transform="translateX("+b.offsetLeft+"px)";tabs.scrollTo({left:b.offsetLeft-tabs.clientWidth/2+b.offsetWidth/2,behavior:"smooth"})}
 });
}
async function show(id){
 cur=id;const my=++tok;mark();
 let res=null;const p=get(id).then(x=>res=x);
 g.classList.add("out");await wait(200);
 if(my!==tok)return;
 if(!res){g.innerHTML=Array.from({length:6},()=>'<div class="card glass sk"></div>').join("");g.classList.remove("out");await p;if(my!==tok)return}
 $("#st").textContent=res[1]==="err"?"Не удалось загрузить ленту. Показаны демо-карточки: не удалось прочитать news.json.":res[1]==="empty"?"В этой категории пока нет свежих новостей.":res[1]==="none"?"Ничего не найдено по запросу «"+q+"»":q?"Найдено: "+res[0].length:"";
 LIST=res[0];SHOWN=0;g.innerHTML="";addCards(true);
 g.classList.remove("out");
}
const PAGE=36;let LIST=[],SHOWN=0;
function addCards(first){
 const part=LIST.slice(SHOWN,SHOWN+PAGE);
 g.insertAdjacentHTML("beforeend",part.map((n,i)=>card(n,first&&i===0?0:(i%12)+1)).join(""));
 SHOWN+=part.length;$("#more").hidden=SHOWN>=LIST.length;
}
$("#more").onclick=()=>addCards(false);
function addTab(s){const b=document.createElement("button");b.textContent=s.name;b.dataset.id=s.id;b.onclick=()=>{const was=q;if(hd.classList.contains("searching")){hd.classList.remove("searching");q="";qi.value=""}if(s.id!==cur||was)show(s.id)};tabs.append(b)}
CATS.forEach(addTab);mark();

document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".glass");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px")});
const tick=()=>{$("#clock").textContent=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})};tick();setInterval(tick,3e4);
const hd=$("header"),qi=$("#q"),sb=$("#sb");
function openS(){hd.classList.add("searching");sb.setAttribute("aria-label","Закрыть поиск");qi.focus()}
function closeS(){hd.classList.remove("searching");sb.setAttribute("aria-label","Поиск");if(q){q="";qi.value="";show(cur)}}
sb.onclick=()=>hd.classList.contains("searching")?closeS():openS();
let qt;qi.addEventListener("input",()=>{clearTimeout(qt);qt=setTimeout(()=>{if(qi.value.trim()!==q){q=qi.value.trim();show(cur)}},250)});
qi.addEventListener("keydown",e=>{if(e.key==="Escape")closeS()});

// Курсы: USD/EUR (ЦБ РФ), Brent и запасные значения — из rates.json, BTC — из открытых API
const R={usd:null,eur:null,brent:null,btc:null};
const RS=[["usd","USD",v=>nf(v,2)+" ₽"],["eur","EUR",v=>nf(v,2)+" ₽"],["brent","Brent",v=>"$"+nf(v,2)],["btc","BTC",v=>"$"+nf(v,0)]];
const nf=(v,d)=>new Intl.NumberFormat("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
function renderRates(){
 $("#rates").innerHTML=RS.map(([k,l,f])=>{
  const r=R[k];
  if(!r||!(r.v>0))return`<span class="rt"><b>${l}</b> —</span>`;
  const ch=r.p>0?(r.v-r.p)/r.p*100:0,c=Math.abs(ch)<0.005?"fl":ch>0?"up":"dn",ar=c==="fl"?"•":ch>0?"▲":"▼";
  return`<span class="rt"><b>${l}</b> ${f(r.v)} <i class="${c}">${ar} ${nf(Math.abs(ch),2)}%</i></span>`;
 }).join("");
}
const jget=async u=>{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()};
async function loadRates(){
 try{const j=await jget("rates.json?v="+Date.now());for(const k in R)if(j.rates&&j.rates[k])R[k]=j.rates[k];renderRates()}catch(e){}
 try{const j=(await jget("https://www.cbr-xml-daily.ru/daily_json.js")).Valute;R.usd={v:j.USD.Value,p:j.USD.Previous};R.eur={v:j.EUR.Value,p:j.EUR.Previous};renderRates()}catch(e){}
 try{const j=(await jget("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true")).bitcoin;R.btc={v:j.usd,p:j.usd/(1+(j.usd_24h_change||0)/100)};renderRates()}
 catch(e){try{const j=await jget("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT");R.btc={v:+j.lastPrice,p:+j.openPrice};renderRates()}catch(e2){}}
}
$("#st").onclick=()=>{if(NEWF){NEWF=false;$("#st").style.cursor="";show(cur)}};
setInterval(async()=>{
 try{
  const j=await jget(DATA+"?v="+Date.now());
  if(!UPD||!j.updated||j.updated===UPD)return;
  DB=null;
  if(!q&&scrollY<150)show(cur);
  else{NEWF=true;const st=$("#st");st.textContent="Появились новые новости — нажмите, чтобы обновить";st.style.cursor="pointer"}
 }catch(e){}
},12e4);
renderRates();loadRates();setInterval(loadRates,3e5);
addEventListener("resize",mark);
show("all");
</script>
</body>
</html>
