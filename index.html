<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrueNews — Новости без лишнего</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:#f5f5f7;background:#0d1015;font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:-35px;z-index:-2;background:radial-gradient(circle at 15% 5%,#4a535e,transparent 28%),radial-gradient(circle at 95% 35%,#51463d,transparent 30%),url('https://images.unsplash.com/photo-1495020689067-958852a7765e?auto=format&fit=crop&w=1800&q=85') center/cover;filter:blur(30px) brightness(.35)}body:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(#0b0e1380,#0b0e13c9)}
header{position:sticky;top:0;z-index:20;padding:10px 14px 0}.glass{max-width:1100px;margin:auto;background:#242a33b8;border:1px solid #ffffff28;border-radius:28px;overflow:hidden;backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);box-shadow:0 16px 50px #0006}.topline{height:92px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 26px}.logo{font-size:39px;font-weight:800;letter-spacing:-2px;white-space:nowrap}.icon{border:0;background:none;color:#fff;font-size:35px;cursor:pointer}.left{justify-self:start}.right{justify-self:end}nav{display:flex;gap:8px;overflow-x:auto;border-top:1px solid #ffffff1c;padding:0 12px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{position:relative;flex:1;min-width:max-content;padding:22px 18px 24px;background:none;border:0;color:#c7cbd2;font:700 21px Georgia,serif;cursor:pointer;transition:color .3s}nav button:after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:3px;border-radius:8px;background:#b7e2ff;transform:scaleX(0);transition:transform .3s}nav button.active{color:#fff}nav button.active:after{transform:scaleX(1)}
main{max-width:920px;margin:26px auto;padding:0 20px 50px}.status{display:flex;align-items:center;gap:9px;color:#d1d5dc;font:14px Arial,sans-serif;margin:0 0 17px 5px}.status i{width:9px;height:9px;border-radius:50%;background:#5fe18a;box-shadow:0 0 0 5px #5fe18a20}.status button{margin-left:auto;border:1px solid #ffffff2d;border-radius:999px;padding:9px 14px;background:#ffffff12;color:#fff;cursor:pointer;font:14px Arial,sans-serif}.status button:disabled{opacity:.5}.feed{display:flex;flex-direction:column;gap:22px}.card{position:relative;min-height:310px;overflow:hidden;border-radius:27px;border:1px solid #ffffff28;isolation:isolate;cursor:pointer;box-shadow:0 14px 38px #0006;transition:transform .3s,box-shadow .3s}.card:hover{transform:translateY(-3px);box-shadow:0 20px 48px #0009}.card:before{content:"";position:absolute;inset:0;z-index:-2;background:var(--image) center/cover;filter:brightness(.62);transition:transform .5s,filter .5s}.card:hover:before{transform:scale(1.04);filter:brightness(.72)}.card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#00000005 5%,#05080d28 35%,#05080df2 100%)}.card-inner{min-height:310px;padding:90px 40px 30px;display:flex;flex-direction:column;justify-content:flex-end}.category{color:#ff5360;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.2px;margin-bottom:12px}.card h2{margin:0 0 20px;font-size:32px;line-height:1.12;text-shadow:0 2px 14px #0009}.meta{display:flex;gap:18px;color:#c4c9d1;font:16px Arial,sans-serif}.empty,.loader{padding:45px;text-align:center;border:1px solid #ffffff25;border-radius:24px;background:#202631b8}.more{display:flex;justify-content:center;padding:25px}.more button{padding:13px 24px;border:1px solid #ffffff2d;border-radius:999px;background:#ffffff12;color:white;cursor:pointer}.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:#000b;backdrop-filter:blur(10px)}.modal.open{display:flex}.article{position:relative;width:min(850px,100%);max-height:90vh;overflow:auto;padding:34px;border:1px solid #ffffff2b;border-radius:26px;background:linear-gradient(145deg,#292f39,#11151c);box-shadow:0 25px 80px #000c}.close{position:absolute;right:17px;top:14px;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff2b;background:#ffffff12;color:#fff;font-size:28px;cursor:pointer}.article h1{font-size:38px;line-height:1.12;margin:12px 45px 18px 0}.article-body{font-size:19px;line-height:1.65;color:#e1e5eb}.article-body p{margin:0 0 18px}.article-note{margin-top:25px;padding-top:15px;border-top:1px solid #ffffff22;color:#949daa;font:13px Arial,sans-serif}footer{text-align:center;color:#8e96a3;font:14px Arial,sans-serif;padding:30px 20px 55px}
@media(max-width:650px){header{padding:7px 8px 0}.glass{border-radius:22px}.topline{height:82px;padding:0 17px}.logo{font-size:31px;letter-spacing:-1.7px}.icon{font-size:29px}nav button{font-size:18px;padding:18px 14px 20px}main{padding:0 10px 35px;margin-top:20px}.feed{gap:17px}.card{min-height:300px;border-radius:23px}.card-inner{min-height:300px;padding:80px 25px 24px}.category{font-size:15px}.card h2{font-size:27px}.meta{font-size:14px}.article{padding:26px 22px;border-radius:22px}.article h1{font-size:29px}.article-body{font-size:17px}}
</style></head>
<body>
<header><div class="glass"><div class="topline"><button class="icon left" aria-label="Меню">☰</button><div class="logo">TrueNews</div><button class="icon right" aria-label="Поиск">⌕</button></div><nav><button class="active" data-cat="main">Главное</button><button data-cat="politics">Политика</button><button data-cat="sport">Спорт</button><button data-cat="petersburg">Санкт-Петербург</button></nav></div></header>
<main><div class="status"><i></i><span id="status">Последние события</span><button id="refresh" type="button">↻ Обновить</button></div><section id="feed" class="feed"><div class="loader">Загружаем новости…</div></section><div id="more" class="more"></div></main><footer>TrueNews — новости без лишнего</footer>
<div id="modal" class="modal"><article class="article"><button class="close" onclick="closeArticle()">×</button><div class="category">TrueNews</div><img id="article-image" alt="" style="width:100%;max-height:360px;object-fit:cover;border-radius:18px;margin:10px 0 22px"><h1 id="title"></h1><div class="meta" id="meta"></div><div class="article-body" id="body"></div><div class="article-note">Материал подготовлен редакцией TrueNews. Информация может уточняться по мере поступления новых данных.</div></article></div>
<script>
const imageSets={
  politics:['https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=1400&q=85','https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1400&q=85'],
  sport:['https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=1400&q=85','https://images.unsplash.com/photo-1579952363873-27f3bede9f55?auto=format&fit=crop&w=1400&q=85'],
  technology:['https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1400&q=85','https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1400&q=85'],
  business:['https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1400&q=85','https://images.unsplash.com/photo-1559526324-593bc073d938?auto=format&fit=crop&w=1400&q=85'],
  general:['https://images.unsplash.com/photo-1495020689067-958852a7765e?auto=format&fit=crop&w=1400&q=85','https://images.unsplash.com/photo-1521295121783-8a321d551ad2?auto=format&fit=crop&w=1400&q=85']
};
function hashText(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function imageFor(n){
  if(n.image) return n.image;
  const t=(n.title+' '+clean(n.description)).toLowerCase();
  let group='general';
  if(/футбол|хоккей|спорт|матч|турнир|чемпион|олимп|теннис|бой/.test(t))group='sport';
  else if(/технолог|ии|искусственн|смартфон|компьютер|робот|науч|космос/.test(t))group='technology';
  else if(/деньг|эконом|бизнес|банк|рынок|акци|инвест|цена|доллар|евро/.test(t))group='business';
  else if(/президент|правитель|министр|парламент|политик|закон|выбор|премьер|переговор/.test(t))group='politics';
  const set=imageSets[group];
  return set[hashText(n.title||'')%set.length];
}
const keys={politics:['политик','президент','правитель','государ','мид','министр','парламент','дума','закон','выбор','премьер'],sport:['спорт','футбол','хоккей','теннис','матч','турнир','чемпион','олимп','гол','бой','nba','ufc'],petersburg:['санкт-петербург','санкт петербург','петербург','ленинградск','фонтанка','мойка78','78.ru','петербурж']};
let news=[],cat='main',shown=0,step=8;
const $=id=>document.getElementById(id);const clean=s=>{const d=document.createElement('div');d.innerHTML=s||'';return(d.textContent||'').replace(/\s+/g,' ').trim()};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function match(n,c){if(c==='main')return true;let t=(n.title+' '+clean(n.description)+' '+(n.source||'')).toLowerCase();return keys[c].some(k=>t.includes(k))}
function list(){return news.filter(n=>match(n,cat))}function categoryName(){return{main:'Главное',politics:'Политика',sport:'Спорт',petersburg:'Санкт-Петербург'}[cat]}
let searchQuery='';
function applySearch(list){
  const q=searchQuery.trim().toLocaleLowerCase('ru-RU');
  if(!q) return list;
  return list.filter(n=>[n.title,n.description,n.ai_article,n.source,n.category].filter(Boolean).join(' ').toLocaleLowerCase('ru-RU').includes(q));
}
function setupSearch(){
  const input=document.querySelector('input[type="search"], #search, .search input');
  if(!input || input.dataset.truenewsSearchBound) return;
  input.dataset.truenewsSearchBound='1';
  input.addEventListener('input',()=>{searchQuery=input.value||''; if(typeof render==='function') render();});
}
function render(){
  let a=applySearch(list()),f=$('feed');
  if(shown===0)f.innerHTML='';
  if(!a.length){f.innerHTML='<div class="empty"><div class="category">'+categoryName()+'</div><h2>В этой категории пока нет новостей</h2><p>Попробуйте выбрать другую вкладку.</p></div>';return}
  let end=Math.min(shown+step,a.length);
  for(let i=shown;i<end;i++){
    let n=a[i],d=n.pub?new Date(n.pub):new Date(),card=document.createElement('article');
    card.className='card';card.style.setProperty('--image',`url("${imageFor(n)}")`);
    card.innerHTML=`<div class="card-inner"><div class="category">${esc(n.source||categoryName())}</div><h2>${esc(n.title||'Без заголовка')}</h2><div class="meta"><span>◷ ${isNaN(d)?'':d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})} ${isNaN(d)?'':d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span><span>◉ TrueNews</span></div></div>`;
    card.onclick=()=>openArticle(n);f.appendChild(card)
  }
  shown=end;
  $('more').innerHTML='';
  if(shown<a.length){$('more').innerHTML='<div class="loader">Прокрутите ниже, чтобы загрузить ещё новости…</div>'}
  else if(a.length){$('more').innerHTML='<div class="loader">Вы просмотрели все доступные новости. Нажмите «Обновить» для новых публикаций.</div>'}
}
function loadMore(){
  const before=shown;render();
  if(shown===before && applySearch(list()).length) load();
}
async function load(){try{let r=await fetch('news.json?ts='+Date.now(),{cache:'no-store'});let d=await r.json();news=Array.isArray(d.news)?d.news:[];$('status').textContent='Последние события · '+news.length+' материалов';shown=0;render()}catch(e){$('feed').innerHTML='<div class="empty"><h2>Не удалось загрузить новости</h2><p>Проверьте наличие файла news.json.</p></div>'}}
$('refresh').onclick=async()=>{const b=$('refresh');b.disabled=true;b.textContent='↻ Обновляем…';await load();b.disabled=false;b.textContent='↻ Обновить'};
const sentinel=new IntersectionObserver(entries=>{if(entries[0].isIntersecting && shown<applySearch(list()).length)render()},{rootMargin:'500px'});sentinel.observe($('more'));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;shown=0;$('refresh').onclick=async()=>{const b=$('refresh');b.disabled=true;b.textContent='↻ Обновляем…';await load();b.disabled=false;b.textContent='↻ Обновить'};
const sentinel=new IntersectionObserver(entries=>{if(entries[0].isIntersecting && shown<applySearch(list()).length)render()},{rootMargin:'500px'});sentinel.observe($('more'));
document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render();scrollTo({top:0,behavior:'smooth'})});
function openArticle(n){
  $('title').textContent=n.title||'Новость TrueNews';
  $('article-image').src=imageFor(n);
  let d=n.pub?new Date(n.pub):new Date();
  $('meta').textContent=(isNaN(d)?'':d.toLocaleString('ru-RU'))+' · '+(n.source||'редакция TrueNews');
  let article=n.ai_article&&String(n.ai_article).trim()
    ? String(n.ai_article).trim()
    : '<p>'+esc(clean(n.description)||'Для этой новости пока нет расширенного материала.')+'</p><p class="article-note">ИИ-статья ещё не подготовлена. Попробуйте открыть материал после обновления.</p>';
  article=article.replace(/```html|```/g,'');
  $('body').innerHTML=article;
  $('modal').classList.add('open');
  document.body.style.overflow='hidden';
}function closeArticle(){$('modal').classList.remove('open');document.body.style.overflow=''}$('modal').onclick=e=>{if(e.target===$('modal'))closeArticle()};document.onkeydown=e=>{if(e.key==='Escape')closeArticle()};load();setInterval(load,1800000);
</script></body></html>

window.addEventListener('DOMContentLoaded',setupSearch);
